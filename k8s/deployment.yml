apiVersion: apps/v1
kind: Deployment
metadata:
    name: go-backend
spec:
    replicas: 2
    selector:
        matchLabels:
            app: backend
    template:
        metadata:
            labels:
                app: backend
        spec:
            containers:
                - name: api
                  image: my-go-backend:v4
                  imagePullPolicy: Never
                  ports:
                      - containerPort: 8080
                  env:
                      - name: AWS_ACCESS_KEY_ID
                        value: "test"
                      - name: AWS_SECRET_ACCESS_KEY
                        value: "test"
                      - name: AWS_REGION
                        value: "us-east-1"
                      - name: S3_BUCKET_NAME
                        value: "app-data-bucket"
                      - name: AWS_ENDPOINT
                        value: "http://localstack:4566"
                        # Pull from Secret
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom:
                            secretKeyRef:
                                name: aws-credentials
                                key: AWS_ACCESS_KEY_ID
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom:
                            secretKeyRef:
                                name: aws-credentials
                                key: AWS_SECRET_ACCESS_KEY

                      # Pull from ConfigMap
                      - name: S3_BUCKET_NAME
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: S3_BUCKET_NAME
                      - name: AWS_REGION
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: AWS_REGION
                      - name: S3_ENDPOINT
                        valueFrom:
                            configMapKeyRef:
                                name: backend-config
                                key: S3_ENDPOINT
