apiVersion: apps/v1
kind: Deployment
metadata:
    name: go-backend
spec:
    replicas: 2
    selector:
        matchLabels:
            app: backend
    template:
        metadata:
            labels:
                app: backend
        spec:
            containers:
                - name: api
                  image: my-go-backend:v3
                  imagePullPolicy: Never
                  ports:
                      - containerPort: 8080
                  env:
                      - name: AWS_ACCESS_KEY_ID
                        value: "test"
                      - name: AWS_SECRET_ACCESS_KEY
                        value: "test"
                      - name: AWS_REGION
                        value: "us-east-1"
                      - name: S3_BUCKET_NAME
                        value: "app-data-bucket"
                      - name: AWS_ENDPOINT
                        value: "http://localstack:4566"
